[project]
name = "easyscholar-mcp"
version = "0.1.0"
description = "Unofficial MCP server for AI agents: journal impact factor, JCR quartile and CAS (中科院) zone lookup via the easyScholar open API"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.2,<2",
    "httpx>=0.27",
]
keywords = ["mcp", "easyscholar", "impact factor", "journal ranking", "JCR", "CAS zone", "ai agent"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering",
]

[project.urls]
Homepage = "https://github.com/tanskeran/easyscholar-mcp"
Issues = "https://github.com/tanskeran/easyscholar-mcp/issues"

[project.scripts]
easyscholar-mcp = "easyscholar_mcp.server:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/easyscholar_mcp"]
